<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#000000"/>
  <defs>
    <mask id="f-mask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
      <rect x="-50" y="-50" width="200" height="200" fill="black"/>
      <polygon points="50,50 -123.2,-50 223.2,-50" fill="white"/>
      <line x1="50" y1="50" x2="-123.2" y2="-50" stroke="black" stroke-width="7"/>
      <line x1="50" y1="50" x2="223.2" y2="-50" stroke="black" stroke-width="7"/>
    </mask>
  </defs>
  
  <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="22" mask="url(#f-mask)" />
  
  <g transform="rotate(120 50 50)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="22" mask="url(#f-mask)" />
  </g>
  
  <g transform="rotate(240 50 50)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="22" mask="url(#f-mask)" />
  </g>
</svg>